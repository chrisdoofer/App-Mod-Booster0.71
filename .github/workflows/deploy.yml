name: Deploy Expense Management

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Azure Resource Group name (e.g. rg-expensemgmt-20251206)'
        required: true
        type: string
      location:
        description: 'Azure region (e.g. uksouth, eastus)'
        required: false
        default: 'uksouth'
        type: string
      base_name:
        description: 'Base name for resources (default: expensemgmt)'
        required: false
        default: 'expensemgmt'
        type: string
      deploy_genai:
        description: 'Deploy Azure OpenAI and AI Search resources'
        required: false
        type: boolean
        default: false

# Required for OIDC authentication — do NOT remove
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Azure login via OIDC (no secrets) ───────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ── Install go-sqlcmd ────────────────────────────────────────────────────
      # Install directly from GitHub releases — Ubuntu 24.04 apt-key method is deprecated
      - name: Install go-sqlcmd
        run: |
          echo "Installing go-sqlcmd from GitHub releases..."
          curl -sSL -o sqlcmd.tar.bz2 https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
          sudo tar -xjf sqlcmd.tar.bz2 -C /usr/local/bin
          rm -f sqlcmd.tar.bz2
          sqlcmd --version
          echo "✓ go-sqlcmd installed"

      # ── Setup .NET 8 SDK ─────────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── Deploy Infrastructure ────────────────────────────────────────────────
      - name: Deploy Infrastructure
        shell: pwsh
        # IMPORTANT: vars.* are NOT automatically env vars — must explicitly map here
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          $infraArgs = @{
            ResourceGroup = "${{ github.event.inputs.resource_group }}"
            Location      = "${{ github.event.inputs.location }}"
            BaseName      = "${{ github.event.inputs.base_name }}"
          }

          if ("${{ github.event.inputs.deploy_genai }}" -eq "true") {
            $infraArgs["DeployGenAI"] = $true
          }

          & ./deploy-infra/deploy.ps1 @infraArgs

      # ── Upload deployment context ────────────────────────────────────────────
      # .deployment-context.json is a dotfile — must use include-hidden-files: true
      - name: Upload deployment context
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-context
          path: .deployment-context.json
          include-hidden-files: true
          retention-days: 7

      # ── Wait for App Service to stabilise ───────────────────────────────────
      - name: Wait for App Service to stabilise
        run: |
          echo "Waiting 60 seconds for App Service settings to apply and SCM to restart..."
          sleep 60

      # ── Deploy Application ────────────────────────────────────────────────────
      - name: Deploy Application
        shell: pwsh
        run: ./deploy-app/deploy.ps1

      # ── Display deployment summary ───────────────────────────────────────────
      - name: Display deployment summary
        if: always()
        run: |
          echo "=== Deployment Summary ==="
          if [ -f ".deployment-context.json" ]; then
            echo "Deployment context:"
            cat .deployment-context.json
          else
            echo "No deployment context file found."
          fi
